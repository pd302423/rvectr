# rvectr CI workflow — MASTER COPY
#
# This file lives here, not at .github/workflows/ci.yml, because the GitHub
# token in use lacks the `workflow` scope and rejects any push that touches
# that path. Keeping it here means the config is version-controlled.
#
# TO ACTIVATE, either:
#   a) regenerate your PAT with `workflow` scope, then:
#        cp docs/ci-workflow.yml .github/workflows/ci.yml
#        git add -f .github/workflows/ci.yml && git commit && git push
#   b) or paste this file's contents into the GitHub web UI:
#        Actions -> New workflow -> set up a workflow yourself
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (kinematics core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules deliberately not fetched: the core test suite must not
        # depend on the heavy CV backends.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

  frontend-build:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  no-fabricated-results:
    name: Guard against unbacked accuracy claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a bare accuracy claim reappears in docs
        run: |
          # Every one of these numbers was previously published with no script
          # behind it. They may only return alongside a regenerating script.
          if grep -rnE '(0\.8|1\.5|1\.6|2\.4)°?\s*(MAE|mean absolute)' \
               --include='*.md' docs/ README.md 2>/dev/null \
             | grep -viE 'removed|not been|no accuracy|unverified|previously'; then
            echo "::error::A previously-fabricated accuracy figure has reappeared."
            echo "No accuracy number ships without a committed script that regenerates it."
            exit 1
          fi
          echo "OK - no unbacked accuracy claims found."
