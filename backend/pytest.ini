[pytest]
# Without testpaths, a bare `pytest` from backend/ recurses into the submodules
# and hits EasyMocap/3rdparty/pybind11/tests/conftest.py, which calls sys.exit(1)
# during collection -> INTERNALERROR, zero tests collected. Pin collection to our
# own suite so `pytest` and `pytest tests/` behave identically.
testpaths = tests

norecursedirs =
    EasyMocap
    4D-Humans
    venv
    .venv*
    node_modules
    *_out
    *_demo_out
    __pycache__

addopts = -ra
