name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (kinematics core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules deliberately not fetched: the core test suite must not
        # depend on the heavy CV backends. Anything needing the SMPL body model
        # (separately licensed, never committed) skips with a reason rather than
        # erroring — see backend/tests/conftest.py.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Required: the pip cache globs for **/requirements.txt or
          # **/pyproject.toml, and this repo has neither — the deps live in
          # backend/requirements-core.txt. Without this the step errors out
          # before installing anything, so no test ever runs.
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  no-fabricated-results:
    name: Guard against unbacked accuracy claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a bare accuracy claim reappears in docs
        run: |
          # Every one of these numbers was previously published with no script
          # behind it. They may only return alongside a regenerating script.
          # A line may opt out by carrying the literal marker `ci-allow` — used
          # for prose that discusses the banned pattern rather than asserting it.
          if grep -rnE '(0\.8|1\.5|1\.6|2\.4)°?\s*(MAE|mean absolute)' \
               --include='*.md' docs/ README.md 2>/dev/null \
             | grep -v 'ci-allow'; then
            echo "::error::A previously-fabricated accuracy figure has reappeared."
            echo "No accuracy number ships without a committed script that regenerates it."
            exit 1
          fi
          echo "OK - no unbacked accuracy claims found."

      - name: Fail if the UI claims accuracy it has not measured
        run: |
          # The web app is the highest-risk surface: a viewer reads it as a
          # result, not as marketing. These phrases were all live at one point.
          if grep -rniE 'sub-?centimet(er|re)|industrial-grade|[0-9]+% accura|eliminat(es|ing) 100%' \
               src/ 2>/dev/null | grep -v 'ci-allow'; then
            echo "::error::An unvalidated accuracy claim reappeared in the web UI."
            exit 1
          fi
          echo "OK - no unbacked accuracy claims in src/."

      - name: Fail if synthetic assets are attributed to a capture backend
        run: |
          # backend/README.md documents squat_3d_mesh.glb and
          # squat_multiview_animated.glb as hand-authored. Naming a real backend
          # next to them is the exact misattribution that shipped once already.
          if grep -rnE '(EasyMocap|4D-Humans|HMR2)[^\n]{0,40}(Output|output)' \
               src/ 2>/dev/null | grep -v 'ci-allow'; then
            echo "::error::A synthetic asset is being attributed to a capture backend."
            exit 1
          fi
          echo "OK - no synthetic assets attributed to a real backend."

  submodule-pointers:
    name: Submodule commits must be fetchable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a recorded submodule commit is not on its remote
        run: |
          # A gitlink pointing at a commit that exists only on one laptop makes
          # `git clone --recursive` fail for everybody, silently. This job is the
          # only thing that catches it before a user does.
          status=0
          while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            url=$(git config --file .gitmodules --get "submodule.$name.url")
            sha=$(git rev-parse "HEAD:$path" 2>/dev/null) || continue
            echo "checking $path -> $sha ($url)"
            if ! git ls-remote "$url" | grep -q "$sha"; then
              echo "::error file=.gitmodules::$path records $sha, which is not on $url. Push the submodule commit to a fork you control and update .gitmodules."
              status=1
            fi
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')
          exit $status
